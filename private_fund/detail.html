  <script data-inline-src="./assets/private-fund-business-text.js?v=20261023T021313208415_github_publish_6948">
/* Presentation only: source structures stay untouched in the exported detail. */
(() => {
  const REVIEW='来源提供了结构化条款，具体内容待核对原文';
  const unique=xs=>[...new Set(xs.filter(x=>x!==null&&x!==undefined&&x!==''))].join('；');
  const text=v=>v===null||v===undefined?'':String(v).trim();
  const structured=v=>v&&typeof v==='object';
  // Display precision only; never infer a missing unit or change the source value.
  function productScale(value, unit='') {
    if(value==null||value==='')return '未披露';
    const hiddenUnits=new Set(['source_unspecified','source_native','unverified','source_raw','unknown']);
    let s=text(value).replace(/（单位未核验）/g,'').trim(),u=text(unit);
    if(hiddenUnits.has(u))u='';
    s=s.replace(/\s+(?:source_unspecified|source_native|unverified|source_raw|unknown)$/,'');
    const match=s.match(/^([+-]?(?:\d[\d,]*(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)(\s*(?:万亿元|亿元|万元|元|亿|万|美元|港元|人民币|USD|HKD|CNY))?$/);
    if(match){const n=Number(match[1].replace(/,/g,''));if(Number.isFinite(n))s=n.toFixed(2)+(match[2]||'').trim();}
    return u&&!s.endsWith(u)?s+u:s;
  }
  function decode(value) {
    if(typeof value!=='string')return value;
    let v=value.trim();
    if(!v||['null','None','undefined'].includes(v))return null;
    for(let i=0;i<3&&typeof v==='string'&&/^[\[{]/.test(v);i++){
      try{v=JSON.parse(v);}catch{return REVIEW;}
    }
    return v;
  }
  function dateText(v) {
    const s=text(v);
    return /^\d{8}$/.test(s)?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`:s;
  }
  function recentDates(value, paymentsOnly=false) {
    const v=decode(value);
    if(!v)return null;

    const DAY_MS=86400000;
    function medianDisclosureGapDays(points){
      if(points.length<2)return null;
      const gaps=[];
      for(let i=1;i<points.length;i++){
        const gap=(points[i].x-points[i-1].x)/DAY_MS;
        if(Number.isFinite(gap)&&gap>0)gaps.push(gap);
      }
      if(!gaps.length)return null;
      gaps.sort((a,b)=>a-b);
      const mid=Math.floor(gaps.length/2);
      return gaps.length%2?gaps[mid]:(gaps[mid-1]+gaps[mid])/2;
    }
    function disclosureCadence(days){
      if(days==null)return'披露频率未知';
      if(days<=3)return'日频披露';
      if(days<=10)return'周度披露';
      if(days<=45)return'月度披露';
      return'不定期披露';
    }
    function linearCurvePath(points,x,y){
      return points.map((p,i)=>`${i?'L':'M'}${x(p.x).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
    }
    function endpointSlope(h0,h1,d0,d1){
      let slope=((2*h0+h1)*d0-h0*d1)/(h0+h1);
      if(Math.sign(slope)!==Math.sign(d0))slope=0;
      else if(Math.sign(d0)!==Math.sign(d1)&&Math.abs(slope)>Math.abs(3*d0))slope=3*d0;
      return slope;
    }
    function monotoneCurvePath(points,x,y){
      if(points.length<3)return linearCurvePath(points,x,y);
      const coords=points.map(p=>({x:x(p.x),y:y(p.y)})),h=[],delta=[];
      for(let i=0;i<coords.length-1;i++){
        const width=coords[i+1].x-coords[i].x;
        if(!(width>0))return linearCurvePath(points,x,y);
        h.push(width);
        delta.push((coords[i+1].y-coords[i].y)/width);
      }
      const slope=new Array(coords.length);
      slope[0]=endpointSlope(h[0],h[1],delta[0],delta[1]);
      slope[slope.length-1]=endpointSlope(h.at(-1),h.at(-2),delta.at(-1),delta.at(-2));
      for(let i=1;i<coords.length-1;i++){
        if(delta[i-1]===0||delta[i]===0||delta[i-1]*delta[i]<=0){slope[i]=0;continue}
        const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];
        slope[i]=(w1+w2)/(w1/delta[i-1]+w2/delta[i]);
      }
      let path=`M${coords[0].x.toFixed(1)},${coords[0].y.toFixed(1)}`;
      for(let i=0;i<coords.length-1;i++){
        const width=h[i];
        path+=` C${(coords[i].x+width/3).toFixed(1)},${(coords[i].y+slope[i]*width/3).toFixed(1)} ${(coords[i+1].x-width/3).toFixed(1)},${(coords[i+1].y-slope[i+1]*width/3).toFixed(1)} ${coords[i+1].x.toFixed(1)},${coords[i+1].y.toFixed(1)}`;
      }
      return path;
    }
