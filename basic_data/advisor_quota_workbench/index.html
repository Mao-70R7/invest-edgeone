    function algorithmDetail(rows,summary="查看算法明细"){

    function equalAlgorithmScenarios(){return `<div class="scenario-list">
      <details><summary>均分例1：名额足够完成多轮</summary><div class="scenario-content"><strong>例：</strong>8名1份权重顾问、2名0.5份权重顾问、普通池20个。两个完整加权轮次合计生成18个整数名额：1份顾问各2个，0.5份顾问各1个；剩余2个不拆散下一轮，留给独立抓阄或后续分配。</div></details>
      <details><summary>均分例2：不足完成第一轮</summary><div class="scenario-content"><strong>例：</strong>10名正常顾问参与，但普通池只有4个。任何四人先拿都会破坏均分，因此均分结果为0；经理可另行发起抓阄。</div></details>

    </div>`}
    function lotteryAlgorithmScenarios(){return `<div class="scenario-list">
      <details><summary>抓阄例1：名额少于候选顾问</summary><div class="scenario-content"><strong>例：</strong>10名顾问均有剩余客户需求，普通池4个。系统同时滚动4个席位，经理手动停止，4名不同顾问各中1个。</div></details>
      <details><summary>抓阄例2：名额覆盖全部候选顾问</summary><div class="scenario-content"><strong>例：</strong>普通池6个，只有4名顾问在扣除本人未分配码后仍有需求。4人直接各得1个，无需随机，剩余2个继续留池。</div></details>

    </div>`}
    function rotationScenarios(){return `<div class="scenario-list">
      <details open><summary>场景1：跨期继续同一轮</summary><div class="scenario-content"><strong>例：</strong>产品处于第1轮，10名顾问个人轮次都是0。第一期只有3个名额，10人抓阄，3名中签者更新为第1轮；第二期还有5个名额，只在剩余7名仍为第0轮的顾问中抓阄。未中签者下一期仍优先，直到本期参与名单全部跟上第1轮。</div></details>
      <details><summary>场景2：全部跟上后进入下一轮</summary><div class="scenario-content"><strong>例：</strong>第1轮只剩顾问甲、乙尚未跟上，本期有5个名额。先给甲、乙各1个并更新为第1轮，此时全员完成第1轮，产品进入第2轮；剩余3个名额再按本期获配较少者优先处理。</div></details>
      <details><summary>场景3：新顾问和重新参加顾问</summary><div class="scenario-content"><strong>新顾问：</strong>产品当前是第5轮，新顾问没有历史记录，系统把起点设为第4轮；获得1个后直接更新为第5轮，不补前4轮。<br><strong>重新参加：</strong>顾问离开时停在第3轮，回来时产品已到第5轮；获得1个后直接更新为第5轮，不补第4轮。<br><strong>本期不参与：</strong>不进入判断，也不阻塞产品轮次推进，个人轮次保持不变。</div></details>
      <details><summary>场景4：为什么还要看本期获配数</summary><div class="scenario-content"><strong>例：</strong>甲、乙、丙已跟上第5轮，丁、戊停在第4轮，本期18个名额。先给丁、戊各1个跟到第5轮；产品进入第6轮后，先给本期仍为0个的甲、乙、丙，再给丁、戊。如此循环，最后不足覆盖时只在本期获配较少的人中抓阄，避免丁、戊因刚补齐又继续中签而比别人多两个。</div></details>
      <details><summary>场景5：回收不让个人轮次倒退</summary><div class="scenario-content"><strong>例：</strong>顾问通过第3轮分配获得1个名额，个人轮次已更新为第3轮。预约码后来未使用并被回收，个人轮次仍为第3轮；回池名额重新分配时，不会把该顾问当成第3轮未跟进人员。</div></details>
      <details><summary>场景6：名额不足覆盖优先组</summary><div class="scenario-content"><strong>例：</strong>产品处于第4轮，有8名顾问仍在第3轮且本期获配同为0个，但只剩3个名额。系统只在这8人中抓阄3人；中签者更新为第4轮，另外5人保持第3轮，下次继续优先。</div></details>
    </div>`}

    function openModal(title,sub,body,buttons,size=""){

    function lookupAccount(){

      ui.registrationAccountId=hit.id;ui.registrationDraft={...ui.registrationDraft,customerName:hit.name,customerNo:hit.id,customerType:hit.type,advisor:isManager()?hit.advisor:ui.operator};renderAdvisor();toast("已关联直销客户数据");

    function submitRegistration(){
      const customerName=$("#reg-name").value.trim(),customerNo=$("#accountLookup").value.trim(),amount=Number($("#reg-amount").value),note=$("#reg-note").value.trim(),customerType=$("#reg-customer-type").value,assignedAdvisor=isManager()?$("#reg-advisor").value:ui.operator;
      if(!customerName||!customerNo){toast("请填写客户姓名和客服系统编号",true);return}
      if(!note){toast("线下登记必须填写补充说明",true);return}
      if(!amount||amount<=0){toast("请填写有效意向资金",true);return}
      let a=account(customerNo);if(!a){a={id:customerNo,name:customerName,phone:"",cert:"",type:customerType,advisor:assignedAdvisor,member:"未关联",risk:"未关联",holdings:"手工登记，待后续关联"};db.accounts.push(a)}
      const created=[],duplicates=[],seenProducts=new Set();

        const c=cycle(cycleId),p=c&&cycleProduct(c.id);if(!c||!p)return;

        db.queues.unshift(item);created.push(item);
      });

    function captureRegistrationDraft(){if(!ui.registrationOpen)return;ui.registrationDraft={customerName:$("#reg-name")?.value.trim()||"",customerNo:$("#accountLookup")?.value.trim()||"",customerType:$("#reg-customer-type")?.value||"普通客户",advisor:$("#reg-advisor")?.value||ui.operator,amount:Number($("#reg-amount")?.value||300),note:$("#reg-note")?.value||""};if(ui.registrationAccountId&&ui.registrationDraft.customerNo!==ui.registrationAccountId)ui.registrationAccountId=""}
    function setAdvisorPeriod(preset){let period;if(preset==="biweekly")period=defaultAdvisorPeriod();if(preset==="prev")period=monthPeriod(-1);if(preset==="current")period=monthPeriod(0);if(preset==="next")period=monthPeriod(1);if(!period)return;ui.advisorPeriodPreset=preset;ui.advisorStart=period.start;ui.advisorEnd=period.end;ui.advisorProductPage=1;ui.advisorSelectedCycleId="";renderAdvisor()}
    function readAdvisorProductFilters(){ui.advisorProductFilter=$("#advisor-product-filter").value.trim();ui.advisorManagerFilter=$("#advisor-manager-filter").value.trim();ui.advisorHasCodes=$("#advisor-has-codes").checked;ui.advisorProductPage=1}
    function readQueueFilters(){ui.queueFilters={name:$("#qf-name").value.trim(),advisor:$("#qf-advisor").value.trim(),status:$("#qf-status").value,customerType:$("#qf-customer-type").value};ui.queuePage=1}
    function readLedgerFilters(){ui.ledgerFilters={issuedCustomer:$("#lf-issued-customer").value.trim(),actualCustomer:$("#lf-actual-customer").value.trim(),type:$("#lf-type").value,state:$("#lf-state").value};ui.ledgerPage=1}

    document.addEventListener("click",event=>{
      if(!event.target.closest(".advisor-switcher"))$("#advisor-scope-suggestions")?.classList.remove("open");
      if(event.target.matches("[data-bulk-queue],#select-all-queues,[data-ledger-code],#select-all-ledger,[data-special-code],#select-all-special,[data-participant-advisor],#select-all-participants,[data-reg-cycle]"))return;
      const target=event.target.closest("button,[data-view],[data-select-advisor-cycle],[data-select-queue],[data-select-code],[data-select-product],[data-toggle-batch],[data-toggle-rotation-cycle],[data-reg-cycle],[data-add-product],[data-toggle-transaction]");
      if(!target)return;
      if(target.dataset.view){ui.view=target.dataset.view;renderShell();return}
      if(target.dataset.advisorScopeOption){selectAdvisorScope(target.dataset.advisorScopeOption);return}
      if(target.dataset.jumpAdvisorDashboard){ui.view="advisor";ui.advisorTab="queues";ui.advisorScope=target.dataset.jumpAdvisorDashboard;ui.advisorSelectedCycleId="";ui.advisorProductPage=1;ui.queuePage=1;ui.ledgerPage=1;ui.selectedQueueId="";ui.selectedCodeId="";ui.selectedQueueIds.clear();ui.selectedLedgerCodeIds.clear();renderShell();return}
      const action=target.dataset.action;
      if(target.dataset.advisorTab){ui.advisorTab=target.dataset.advisorTab;ui.selectedQueueId="";ui.selectedCodeId="";ui.selectedQueueIds.clear();ui.selectedLedgerCodeIds.clear();renderAdvisor();return}
      if(target.dataset.periodPreset){setAdvisorPeriod(target.dataset.periodPreset);return}
      if(target.dataset.selectAdvisorCycle){ui.advisorSelectedCycleId=target.dataset.selectAdvisorCycle;ui.queuePage=1;ui.ledgerPage=1;ui.selectedQueueId="";ui.selectedCodeId="";ui.selectedQueueIds.clear();ui.selectedLedgerCodeIds.clear();if(ui.registrationOpen)ui.registrationProducts=[ui.advisorSelectedCycleId];renderAdvisor();return}
      if(target.dataset.managerWorkspace){ui.managerWorkspace=target.dataset.managerWorkspace;ui.selectedAdvisorProfile="";renderProducts();return}
      if(target.dataset.selectAdvisorProfile){ui.selectedAdvisorProfile=ui.selectedAdvisorProfile===target.dataset.selectAdvisorProfile?"":target.dataset.selectAdvisorProfile;renderProducts();if(ui.selectedAdvisorProfile)requestAnimationFrame(()=>$(".advisor-profile")?.scrollIntoView({behavior:"smooth",block:"start"}));return}
      if(target.dataset.productTab){ui.productTab=target.dataset.productTab;if(ui.productTab!=="special")ui.selectedSpecialCodeIds.clear();if(ui.productTab!=="participation")ui.selectedParticipantNames.clear();renderProducts();return}
      if(target.dataset.selectQueue){openQueueDetail(target.dataset.selectQueue);return}
      if(target.dataset.selectCode){openCodeDetail(target.dataset.selectCode);return}
      if(target.dataset.toggleTransaction){const id=target.dataset.toggleTransaction;ui.expandedTransactions.has(id)?ui.expandedTransactions.delete(id):ui.expandedTransactions.add(id);renderAdvisor();return}
      if(target.dataset.selectProduct){ui.selectedProductId=target.dataset.selectProduct;ui.selectedCycleId=latestCycle(ui.selectedProductId)?.id||"";ui.selectedSpecialCodeIds.clear();ui.selectedParticipantNames.clear();ui.specialPage=1;renderProducts();requestAnimationFrame(()=>$("#productDetail")?.scrollIntoView({behavior:"smooth",block:"start"}));return}
      if(target.dataset.toggleBatch){const id=target.dataset.toggleBatch;ui.expandedBatches.has(id)?ui.expandedBatches.delete(id):ui.expandedBatches.add(id);renderProducts();return}
      if(target.dataset.toggleRotationCycle){const id=target.dataset.toggleRotationCycle;ui.expandedRotationCycles.has(id)?ui.expandedRotationCycles.delete(id):ui.expandedRotationCycles.add(id);renderProducts();return}
      if(target.dataset.sortScope){const scope=target.dataset.sortScope,key=target.dataset.sortKey,sortKey=scope==="queue"?"queueSort":scope==="ledger"?"ledgerSort":scope==="advisorProduct"?"advisorProductSort":"advisorSort",dirKey=scope==="queue"?"queueDir":scope==="ledger"?"ledgerDir":scope==="advisorProduct"?"advisorProductDir":"advisorDir";ui[dirKey]=ui[sortKey]===key&&ui[dirKey]==="asc"?"desc":"asc";ui[sortKey]=key;renderShell();return}
      if(target.dataset.pageAction){const delta=Number(target.dataset.pageDir),kind=target.dataset.pageAction;if(kind==="queue-page")ui.queuePage+=delta;if(kind==="ledger-page")ui.ledgerPage+=delta;if(kind==="product-page")ui.productPage+=delta;if(kind==="advisor-product-page")ui.advisorProductPage+=delta;if(kind==="special-page")ui.specialPage+=delta;renderShell();return}
      if(target.dataset.removeRegCycle){captureRegistrationDraft();ui.registrationProducts=ui.registrationProducts.filter(x=>x!==target.dataset.removeRegCycle);renderRegistrationInner();return}
      if(target.dataset.addProduct){const id=target.dataset.addProduct;target.checked?ui.modal.productIds.push(id):ui.modal.productIds=ui.modal.productIds.filter(x=>x!==id);return}
      if(target.dataset.adjustAdvisor){adjustAdvisorQuota(target.dataset.advisor,Number(target.dataset.adjustAdvisor));return}
      if(target.dataset.jumpLedger){const c=cycle(ui.selectedCycleId),name=target.dataset.jumpLedger;ui.view="advisor";ui.advisorTab="ledger";ui.advisorScope=ADVISOR_NAMES.includes(name)?name:ui.operator;ui.advisorStart=c?.start||ui.advisorStart;ui.advisorEnd=c?.end||ui.advisorEnd;ui.advisorPeriodPreset="custom";ui.advisorSelectedCycleId=ui.selectedCycleId;ui.ledgerFilters={issuedCustomer:"",actualCustomer:"",type:"",state:""};ui.ledgerPage=1;ui.selectedCodeId="";ui.selectedLedgerCodeIds.clear();renderShell();return}
      if(target.dataset.baseStatus){return}
      const handlers={
        "toggle-registration":()=>{ui.registrationOpen=!ui.registrationOpen;if(ui.registrationOpen&&!ui.registrationProducts.length&&ui.advisorSelectedCycleId)ui.registrationProducts=[ui.advisorSelectedCycleId];renderAdvisor()},
        "query-advisor-products":()=>{readAdvisorProductFilters();renderAdvisor()},
        "clear-advisor-products":()=>{ui.advisorProductFilter="";ui.advisorManagerFilter="";ui.advisorHasCodes=false;ui.advisorProductPage=1;renderAdvisor()},
        "lookup-account":lookupAccount,
        "search-reg-products":()=>{captureRegistrationDraft();ui.registrationQuery=$("#reg-product-query").value.trim();renderRegistrationInner()},
        "submit-registration":submitRegistration,
        "query-queues":()=>{readQueueFilters();renderAdvisor()},
        "clear-queue-filters":()=>{ui.queueFilters={name:"",advisor:"",status:"",customerType:""};ui.queuePage=1;renderAdvisor()},
        "query-ledger":()=>{readLedgerFilters();renderAdvisor()},
        "clear-ledger-filters":()=>{ui.ledgerFilters={issuedCustomer:"",actualCustomer:"",type:"",state:""};ui.ledgerPage=1;renderAdvisor()},
        "collapse-queue-detail":()=>{ui.selectedQueueId="";renderAdvisor()},
        "collapse-code-detail":()=>{ui.selectedCodeId="";renderAdvisor()},
        "save-queue-detail":()=>saveQueueDetail(target.dataset.id),
        "cancel-queue":()=>openCancelQueues([target.dataset.id]),
        "open-queue-batch":openQueueBatch,
        "confirm-cancel-queues":confirmCancelQueues,
        "clear-queue-selection":()=>{ui.selectedQueueIds.clear();renderAdvisor()},
        "open-ledger-batch":openLedgerBatch,
        "confirm-ledger-batch":confirmLedgerBatch,
        "clear-ledger-selection":()=>{ui.selectedLedgerCodeIds.clear();renderAdvisor()},
        "assign-code":()=>openAssignCode(target.dataset.id||ui.selectedQueueId),
        "confirm-assign-code":confirmAssignCode,
        "recall-customer-code":()=>openRecallConfirm(queue(target.dataset.id)),
        "confirm-recall-customer":confirmRecallCustomer,
        "recall-code-direct":()=>{const q=db.queues.find(x=>x.codeId===target.dataset.codeId);if(q)openRecallConfirm(q)},
        "simulate-order":()=>openSimulateOrder(target.dataset.codeId||target.dataset.id),
        "confirm-order":confirmOrder,
        "replace-failed-code":()=>openReplacement(queue(target.dataset.id)),
        "replace-code-direct":()=>openReplacement(code(target.dataset.codeId)),
        "confirm-replacement":confirmReplacement,
        "reveal-code":()=>revealCode(target.dataset.codeId),
        "copy-code":()=>copyCode(target.dataset.codeId),
        "update-transaction":()=>updateTransaction(target.dataset.codeId),
        "confirm-transaction":confirmTransaction,
        "query-products":()=>{ui.productQuery=$("#productQuery").value.trim();ui.productPage=1;renderProducts()},
        "new-product":openNewProduct,
        "confirm-new-product":confirmNewProduct,
        "bind-product-code":openBindProductCode,
        "confirm-bind-product-code":confirmBindProductCode,
        "edit-product":openEditProduct,
        "confirm-edit-product":confirmEditProduct,
        "new-cycle":()=>openNewCycle(target.dataset.productId),
        "confirm-new-cycle":confirmNewCycle,
        "save-cycle":saveCycleSettings,
        "open-equal":openEqual,
        "confirm-equal":confirmEqual,
        "open-lottery":openLottery,
        "start-draw":startDraw,
        "stop-draw":stopDraw,
        "direct-draw":directDraw,
        "confirm-lottery":()=>ui.modal.kind==="rotation"?confirmRotation():confirmLottery(),
        "open-rotation":openRotation,
        "confirm-rotation":confirmRotation,
        "reset-advisor-sort":()=>{ui.advisorSort="business";ui.advisorDir="asc";renderProducts()},
        "toggle-zero-advisors":()=>{ui.showZero=!ui.showZero;renderProducts()},
        "create-special-codes":openCreateSpecialCodes,
        "lookup-special-account":lookupSpecialAccount,
        "confirm-create-special-codes":confirmCreateSpecialCodes,
        "open-special-batch-adjust":openSpecialBatchAdjust,
        "confirm-special-batch-adjust":confirmSpecialBatchAdjust,
        "recall-special-batch":openRecallSpecialBatch,
        "confirm-recall-special-batch":confirmRecallSpecialBatch,
        "clear-special-selection":()=>{ui.selectedSpecialCodeIds.clear();renderProducts()},
        "open-participant-batch":openParticipantBatch,
        "confirm-participant-batch":confirmParticipantBatch,
        "clear-participant-selection":()=>{ui.selectedParticipantNames.clear();renderProducts()},
        "return-code-to-pool":()=>openReturnCodeToPool(target.dataset.codeId),
        "confirm-return-code-to-pool":confirmReturnCodeToPool,
        "close-advisor-profile":()=>{ui.selectedAdvisorProfile="";renderProducts()},
        "open-reset":()=>openModal("重置演示数据","将清除本浏览器中的演示操作，恢复完整初始样例。",`<div class="notice danger">重置后，新增登记、分配批次、回收替换、产品周期修改和操作日志都会恢复到初始状态。</div>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-reset">确认重置</button>`,"small"),
        "confirm-reset":()=>{localStorage.removeItem(STORAGE_KEY);db=makeSeed();ui.advisorScope=ui.operator;ui.selectedQueueId="";ui.selectedCodeId="";ui.selectedQueueIds.clear();ui.selectedLedgerCodeIds.clear();ui.selectedSpecialCodeIds.clear();ui.selectedParticipantNames.clear();ui.registrationOpen=false;ui.advisorSelectedCycleId="";save();closeModal();renderShell();toast("演示数据已重置")},
        "close-modal":closeModal
      };
      if(handlers[action])handlers[action]();
    });
    document.addEventListener("change",event=>{
      handleInputChange(event);
      if(event.target.id==="operatorSelect"){ui.operator=event.target.value;ui.advisorScope=ui.operator;if(!isManager()&&ui.view==="products")ui.view="advisor";ui.queueFilters.advisor="";ui.ledgerFilters={issuedCustomer:"",actualCustomer:"",type:"",state:""};ui.registrationDraft.advisor=ui.operator;ui.advisorSelectedCycleId="";ui.selectedQueueId="";ui.selectedCodeId="";ui.selectedQueueIds.clear();ui.selectedLedgerCodeIds.clear();renderShell()}
      if(event.target.id==="cycleSelector"){ui.selectedCycleId=event.target.value;ui.productTab="cycle";ui.selectedSpecialCodeIds.clear();ui.selectedParticipantNames.clear();ui.specialPage=1;renderProducts()}
      if(event.target.id==="advisor-start"||event.target.id==="advisor-end"){ui.advisorStart=$("#advisor-start").value;ui.advisorEnd=$("#advisor-end").value;if(ui.advisorStart>ui.advisorEnd){toast("开始日期不能晚于结束日期",true);return}ui.advisorPeriodPreset="custom";ui.advisorProductPage=1;ui.advisorSelectedCycleId="";renderAdvisor()}
      if(event.target.id==="advisor-has-codes"){ui.advisorHasCodes=event.target.checked;ui.advisorProductPage=1;ui.advisorSelectedCycleId="";renderAdvisor()}
      if(event.target.matches("[data-reg-cycle]")){captureRegistrationDraft();const id=event.target.dataset.regCycle;event.target.checked?ui.registrationProducts.push(id):ui.registrationProducts=ui.registrationProducts.filter(x=>x!==id);renderRegistrationInner()}
      if(event.target.matches("[data-bulk-queue]")){const id=event.target.dataset.bulkQueue;event.target.checked?ui.selectedQueueIds.add(id):ui.selectedQueueIds.delete(id);updateQueueSelectionBar()}
      if(event.target.id==="select-all-queues"){const rows=paginate(queueRows(),ui.queuePage,ui.queueSize).filter(item=>item.state==="排队中");rows.forEach(item=>event.target.checked?ui.selectedQueueIds.add(item.id):ui.selectedQueueIds.delete(item.id));$(".queue-table")?.querySelectorAll("input[data-bulk-queue]:not([disabled])").forEach(input=>input.checked=event.target.checked);updateQueueSelectionBar()}
      if(event.target.matches("[data-ledger-code]")){const id=event.target.dataset.ledgerCode;event.target.checked?ui.selectedLedgerCodeIds.add(id):ui.selectedLedgerCodeIds.delete(id);renderAdvisor()}
      if(event.target.id==="select-all-ledger"){const rows=paginate(ledgerRows(),ui.ledgerPage,ui.ledgerSize).filter(ledgerBatchSelectable);rows.forEach(item=>event.target.checked?ui.selectedLedgerCodeIds.add(item.id):ui.selectedLedgerCodeIds.delete(item.id));renderAdvisor()}
      if(event.target.id==="ledger-batch-operation")updateLedgerBatchHint();
      if(event.target.matches("[data-special-code]")){const id=event.target.dataset.specialCode;event.target.checked?ui.selectedSpecialCodeIds.add(id):ui.selectedSpecialCodeIds.delete(id);const bar=$("#specialBulkBar"),count=$("#special-bulk-count");if(bar)bar.classList.toggle("show",ui.selectedSpecialCodeIds.size>0);if(count)count.textContent=ui.selectedSpecialCodeIds.size}
      if(event.target.id==="select-all-special"){const rows=paginate(currentCycleCodes(ui.selectedCycleId,"special").sort((a,b)=>b.createdAt.localeCompare(a.createdAt)),ui.specialPage,ui.specialSize).filter(item=>!["已使用","已作废"].includes(item.state));rows.forEach(item=>event.target.checked?ui.selectedSpecialCodeIds.add(item.id):ui.selectedSpecialCodeIds.delete(item.id));$(".special-code-table")?.querySelectorAll("input[data-special-code]:not([disabled])").forEach(input=>input.checked=event.target.checked);const bar=$("#specialBulkBar"),count=$("#special-bulk-count");if(bar)bar.classList.toggle("show",ui.selectedSpecialCodeIds.size>0);if(count)count.textContent=ui.selectedSpecialCodeIds.size}
      if(event.target.matches("[data-participant-advisor]")){const name=event.target.dataset.participantAdvisor;event.target.checked?ui.selectedParticipantNames.add(name):ui.selectedParticipantNames.delete(name);renderProducts()}
      if(event.target.id==="select-all-participants"){ADVISOR_NAMES.forEach(name=>event.target.checked?ui.selectedParticipantNames.add(name):ui.selectedParticipantNames.delete(name));renderProducts()}
      if(event.target.id==="special-code-type")toggleSpecialCustomerFields();
      if(event.target.matches("[data-base-status]")){const a=advisor(event.target.dataset.baseStatus);a.baseStatus=event.target.value;logAudit("编辑顾问基础状态",`${a.name} -> ${a.baseStatus}`);save();renderProducts();toast("顾问基础状态已更新，只影响后续未确认批次")}
      if(event.target.matches("[data-base-weight]")){const a=advisor(event.target.dataset.baseWeight);a.baseWeight=Number(event.target.value);logAudit("编辑顾问分配权重",`${a.name} -> ${a.baseWeight}份`);save();renderProducts();toast("顾问分配权重已更新，只影响后续未确认批次")}
    });
    document.addEventListener("input",event=>{
      if(event.target.matches(".quota-input"))handleInputChange(event);
      if(event.target.matches("[data-special-field]")&&!ui.composition){const codeId=event.target.dataset.codeId,field=event.target.dataset.specialField,value=event.target.value;clearTimeout(ui.specialFieldTimer);ui.specialFieldTimer=setTimeout(()=>updateSpecialField(codeId,field,value),420)}
      if(event.target.id==="advisor-scope-input"&&!ui.composition){clearTimeout(ui.advisorScopeTimer);const value=event.target.value;ui.advisorScopeTimer=setTimeout(()=>renderAdvisorScopeSuggestions(value),360)}
      if(event.target.id==="add-product-search"&&!ui.composition){
        clearTimeout(ui.addProductTimer);ui.addProductTimer=setTimeout(()=>{const term=event.target.value.trim().toLowerCase(),rows=ui.modal.available.map(product).filter(p=>`${p.code}${p.name}${p.fundManager}`.toLowerCase().includes(term));$("#add-product-list tbody").innerHTML=rows.map(p=>`<tr><td><input type="checkbox" data-add-product="${p.id}" ${ui.modal.productIds.includes(p.id)?"checked":""}></td><td class="code-text">${p.code}</td><td><strong>${p.name}</strong></td><td>${p.fundManager}</td></tr>`).join("")},420);
      }
    });
    document.addEventListener("compositionstart",()=>ui.composition=true);
    document.addEventListener("compositionend",event=>{ui.composition=false;event.target.dispatchEvent(new Event("input",{bubbles:true}))});
    document.addEventListener("focusin",event=>{if(event.target.id==="advisor-scope-input")renderAdvisorScopeSuggestions(event.target.value)});
    document.addEventListener("keydown",event=>{if(event.key!=="Enter"||ui.composition)return;if(event.target.id==="productQuery"){event.preventDefault();ui.productQuery=event.target.value.trim();ui.productPage=1;renderProducts()}if(event.target.id==="advisor-product-filter"||event.target.id==="advisor-manager-filter"){event.preventDefault();readAdvisorProductFilters();renderAdvisor()}if(event.target.id==="lf-issued-customer"||event.target.id==="lf-actual-customer"){event.preventDefault();readLedgerFilters();renderAdvisor()}if(event.target.id==="advisor-scope-input"){event.preventDefault();const match=ADVISOR_NAMES.find(name=>name===event.target.value.trim())||ADVISOR_NAMES.find(name=>name.includes(event.target.value.trim()));if(match)selectAdvisorScope(match);else toast("没有匹配顾问",true)}if(event.target.id==="accountLookup"){event.preventDefault();lookupAccount()}if(event.target.id==="reg-product-query"){event.preventDefault();captureRegistrationDraft();ui.registrationQuery=event.target.value.trim();renderRegistrationInner()}});
    $("#modalLayer").addEventListener("click",event=>{if(event.target===$("#modalLayer"))toast("请使用右上角 × 或底部取消按钮关闭弹窗")});
    renderShell();
    void readIndexedSnapshot().then(record=>{
      if(record?.data?.seedVersion===SEED_VERSION&&Number(record.updatedAt)>Number(db.updatedAt||0)){
        db=record.data;localStorage.setItem(STORAGE_KEY,JSON.stringify(db));renderShell();
      }else{
        void writeIndexedSnapshot(db);
      }
    });
  </script>
